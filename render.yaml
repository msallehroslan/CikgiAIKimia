services:
  # ── FastAPI Web Service ──────────────────────────────────────────────────
  - type: web
    name: cikgu-ai-kimia-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FAISS_INDEX_DIR
        value: ./faiss_indexes
      - key: KB_DIR
        value: ./knowledge_base
      - key: RETRIEVAL_THRESHOLD
        value: "0.30"
      - key: MAX_CONTEXT_CHARS
        value: "3000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VISION_PROVIDER
        value: groq
      - key: LOG_LEVEL
        value: INFO

  # ── Telegram Bot Worker ──────────────────────────────────────────────────
  - type: worker
    name: cikgu-ai-kimia-bot
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot/telegram_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
